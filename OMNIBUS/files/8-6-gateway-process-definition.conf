# Section 8.6 – Paste this process definition into $OMNIHOME/etc/nco_pa.conf
# after the existing process definitions.
# Replace <YOUR-FQDN> with the fully qualified hostname of your lab server.

nco_process 'EventsBackupBidirectionalGateway'
{
        Command '$OMNIHOME/bin/nco_g_objserv_bi -propsfile $OMNIHOME/gates/events_backup/objserv_bi.props' run as 0
        Host = '<YOUR-FQDN>'
        Managed = True
        RestartMsg = '${NAME} running as ${EUID} has been restored on ${HOST}.'
        AlertMsg = '${NAME} running as ${EUID} has died on ${HOST}.'
        RetryCount = 0
        ProcessType = PaNOT_PA_AWARE
}
