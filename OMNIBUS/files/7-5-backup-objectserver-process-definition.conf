# Section 7.5 – Paste this process definition into $OMNIHOME/etc/nco_pa.conf
# after the existing process definitions.
# Replace <YOUR-FQDN> with the fully qualified hostname of your lab server.

nco_process 'BackupObjectServer'
{
    Command '$OMNIHOME/bin/nco_objserv -name EVENTS_BACKUP -pa NCO_PA' run as 0
    Host            =       '<YOUR-FQDN>'
    Managed         =       True
    RestartMsg      =       '${NAME} running as ${EUID} has been restored on ${HOST}.'
    AlertMsg        =       '${NAME} running as ${EUID} has died on ${HOST}.'
    RetryCount      =       0
    ProcessType     =       PaPA_AWARE
}
