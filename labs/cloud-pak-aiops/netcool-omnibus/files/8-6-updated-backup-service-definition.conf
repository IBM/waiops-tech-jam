# Section 8.6 – Replace the existing BackupObjectServerService definition in
# $OMNIHOME/etc/nco_pa.conf with this updated version that includes the gateway.
# The gateway depends on BackupObjectServer so PA starts the ObjectServer first.

nco_service 'BackupObjectServerService'
{
        ServiceType = Non-Master
        ServiceStart = Non-Auto
        process 'BackupObjectServer' NONE
        process 'EventsBackupBidirectionalGateway' 'BackupObjectServer'
}
