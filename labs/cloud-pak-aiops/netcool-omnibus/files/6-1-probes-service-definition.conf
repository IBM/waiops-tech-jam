# Section 6.1 – Paste this service definition into $OMNIHOME/etc/nco_pa.conf
# after the existing Core service definition.

nco_service 'Probes'
{
        ServiceType     =       Non-Master
        ServiceStart    =       Auto
        process 'SyslogdProbe' NONE
        process 'MttrapdProbe' NONE
}
